<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You — NewsHub</title>
<link rel="stylesheet" href="/css/styles.css">
<script src="/js/theme.js"></script>
</head>
<body>
<div id="site-header"></div>

<main class="page-main">
  <div class="container" style="padding-top:40px;">
    <h1 class="section-title" style="font-size:36px;">For You</h1>
    <p style="color:var(--text-muted); margin: 8px 0 24px;">Ranked by your interests, location, recency, sources you follow, and what's trending.</p>
    <div id="feed">
      <div class="center-loading"><div class="spinner"></div> Scoring your feed…</div>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="/js/api.js"></script>
<script src="/js/chrome.js"></script>
<script src="/js/helpers.js"></script>
<script>
NewsHubChrome.init('for-you');

(async () => {
  const user = await requireAuthOrRedirect();
  if (!user) return;

  const feed = document.getElementById('feed');
  try {
    const { articles } = await NewsHubAPI.getPersonalized();
    if (!articles.length) {
      feed.innerHTML = `<div class="empty-state"><h3>Nothing scored yet</h3><p>Follow a few more topics or sources in your Profile to sharpen your feed.</p></div>`;
      return;
    }
    feed.innerHTML = `<div class="grid-12">
      ${articles.map(a => `<div style="grid-column: span 4;">
        ${ArticleCards.compact(a)}
        <div style="font-size:11px; color:var(--text-muted); margin-top:6px;">Match score: ${(a.personalizationScore*100).toFixed(0)}%</div>
      </div>`).join('')}
    </div>`;
    ArticleCards.bindSaveButtons(feed);
  } catch (err) {
    feed.innerHTML = `<div class="empty-state"><h3>Couldn't load your feed</h3><p>${NewsHubChrome.escapeHtml(err.message)}</p></div>`;
  }
})();
</script>
</body>
</html>
