<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build My NewsHub</title>
<link rel="stylesheet" href="/css/styles.css">
<script src="/js/theme.js"></script>
</head>
<body>
<div id="site-header"></div>

<main class="onboard-shell" style="text-align:center;">
  <div class="onboard-progress">
    <div class="step done"></div>
    <div class="step done"></div>
    <div class="step done"></div>
  </div>
  <h1>You're all set.</h1>
  <p class="lede">We'll use your interests and location to build a personalized front page, just for you.</p>

  <div style="margin: 48px 0;" id="buildStatus">
    <div class="spinner" style="margin:0 auto 16px;"></div>
    <p style="color:var(--text-muted);font-size:14px;" id="buildText">Gathering your first stories…</p>
  </div>

  <button class="btn btn-primary" id="enterBtn" style="display:none;">Enter NewsHub →</button>
</main>

<div id="site-footer"></div>

<script src="/js/api.js"></script>
<script src="/js/chrome.js"></script>
<script src="/js/helpers.js"></script>
<script>
NewsHubChrome.init(null);

(async () => {
  const user = await requireAuthOrRedirect();
  if (!user) return;

  try {
    await NewsHubAPI.completeOnboarding();
    // Warm the personalized feed so Home has content immediately.
    await NewsHubAPI.getPersonalized().catch(() => {});
  } catch (e) { /* non-fatal */ }

  document.getElementById('buildText').textContent = 'Your NewsHub is ready.';
  document.querySelector('.spinner').style.display = 'none';
  document.getElementById('enterBtn').style.display = 'inline-flex';
})();

document.getElementById('enterBtn').addEventListener('click', () => {
  window.location.href = '/pages/home.html';
});
</script>
</body>
</html>
