<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saved — NewsHub</title>
<link rel="stylesheet" href="/css/styles.css">
<script src="/js/theme.js"></script>
</head>
<body>
<div id="site-header"></div>

<main class="page-main">
  <div class="container" style="padding-top:40px;">
    <h1 class="section-title" style="font-size:36px;">Saved Articles</h1>
    <p style="color:var(--text-muted); margin: 8px 0 24px;">Stories you've bookmarked to read later.</p>
    <div id="feed">
      <div class="center-loading"><div class="spinner"></div> Loading your saved articles…</div>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="/js/api.js"></script>
<script src="/js/chrome.js"></script>
<script src="/js/helpers.js"></script>
<script>
NewsHubChrome.init('saved');

(async () => {
  const user = await requireAuthOrRedirect();
  if (!user) return;

  const feed = document.getElementById('feed');
  try {
    const { articles } = await NewsHubAPI.getSaved();
    if (!articles.length) {
      feed.innerHTML = `<div class="empty-state"><h3>No saved articles yet</h3><p>Tap the bookmark icon on any story to save it here.</p></div>`;
      return;
    }
    feed.innerHTML = `<div class="grid-12">
      ${articles.map(a => `<div style="grid-column: span 4;">
        <article class="article-card">
          <a href="/pages/article.html?id=${a.id}" class="article-media">
            ${a.imageUrl ? `<img src="${a.imageUrl}" alt="" loading="lazy">` : ''}
          </a>
          <div class="eyebrow accent">${NewsHubChrome.escapeHtml((a.source?.name||'NEWS').toUpperCase())}</div>
          <a href="/pages/article.html?id=${a.id}"><h3>${NewsHubChrome.escapeHtml(a.title)}</h3></a>
          <div class="meta-row">
            <span style="color:var(--text-muted); font-size:13px;">Saved ${NewsHubChrome.timeAgo(a.savedAt)}</span>
            <button class="btn btn-ghost unsave-btn" data-id="${a.id}">Remove</button>
          </div>
        </article>
      </div>`).join('')}
    </div>`;

    feed.querySelectorAll('.unsave-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        await NewsHubAPI.unsaveArticle(btn.dataset.id);
        btn.closest('[style]').remove();
        NewsHubChrome.toast('Removed from Saved');
      });
    });
  } catch (err) {
    feed.innerHTML = `<div class="empty-state"><h3>Couldn't load saved articles</h3><p>${NewsHubChrome.escapeHtml(err.message)}</p></div>`;
  }
})();
</script>
</body>
</html>
